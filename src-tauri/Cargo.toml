[package]
name = "app"
version = "0.1.0"
description = "ieum-captions — 거실 STT 자막 앱 (외할머니용)"
authors = ["Cho Yeonseo <cyseo107@gmail.com>"]
license = "MIT"
repository = "https://github.com/yeonseo107/ieum-captions"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
# sidecar를 process group(Unix)/JobObject(Windows)으로 spawn — 자식의 자식까지 한 번에 정리.
command-group = "5"
